apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudops
  template:
    metadata:
      labels:
        app: cloudops
    spec:
      containers:
        - name: cloudops-container
          image: chiks18/cloudops-solutions:v1
          ports:
            - containerPort: 80