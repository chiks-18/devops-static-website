name: Continuous Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
          -t chiks18/cloudops-solutions:latest \
          -t chiks18/cloudops-solutions:${{ github.sha }} .

      - name: Push Latest Image
        run: docker push chiks18/cloudops-solutions:latest

      - name: Push Version Image
        run: docker push chiks18/cloudops-solutions:${{ github.sha }}

      - name: Image Information
        run: |
          echo "Latest Image: chiks18/cloudops-solutions:latest"
          echo "Version Image: chiks18/cloudops-solutions:${{ github.sha }}"